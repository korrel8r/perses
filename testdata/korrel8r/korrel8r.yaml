# Minimal cluster-free Korrel8r configuration, adapted from upstream
# cmd/korrel8r/testdata/korrel8r.yaml.
stores:
  - domain: mock
    mockData: mock_store.yaml

rules:
  - name: foobar
    start:
      domain: mock
      classes: [foo]
    goal:
      domain: mock
      classes: [bar]
    result:
      query: "mock:bar:y"

  - name: barfoo
    start:
      domain: mock
      classes: [bar]
    goal:
      domain: mock
      classes: [foo]
    result:
      query: "mock:foo:x"
